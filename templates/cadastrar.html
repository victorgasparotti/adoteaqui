{% extends "template.html" %}
{% block conteudo %}
<section class="intro">
  <h1>Cadastrar animal</h1>
  <p>Preencha os dados e envie uma foto para ele aparecer na lista.</p>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</section>

<form class="formulario" action="{{ url_for('criar') }}" method="post" enctype="multipart/form-data">
  <div class="campo">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="especie">Espécie</label>
      <input type="text" id="especie" name="especie" placeholder="Cachorro, gato..." required>
    </div>
    <div class="campo">
      <label for="raca">Raça</label>
      <input type="text" id="raca" name="raca" placeholder="Sem raça definida" required>
    </div>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="idade">Idade</label>
      <input type="text" id="idade" name="idade" placeholder="Ex.: 1 ano, 3 meses" required>
    </div>
    <div class="campo">
      <label for="porte">Porte</label>
      <select id="porte" name="porte" required>
        <option value="" disabled selected>Escolha o porte</option>
        <option value="Pequeno">Pequeno</option>
        <option value="Médio">Médio</option>
        <option value="Grande">Grande</option>
      </select>
    </div>
    <div class="campo">
      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="Disponível" selected>Disponível</option>
        <option value="Adotado">Adotado</option>
      </select>
    </div>
  </div>

  <div class="campo">
    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" rows="5" placeholder="Personalidade, cuidados, se é vacinado..." required></textarea>
  </div>

  <div class="campo">
    <label for="foto">Foto</label>
    <input type="file" id="foto" name="foto" accept="image/jpeg,image/png" required>
  </div>

  <div class="formulario-acoes">
    <button type="submit" class="btn btn-primario">Salvar animal</button>
    <a class="btn btn-contorno" href="{{ url_for('inicio') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
