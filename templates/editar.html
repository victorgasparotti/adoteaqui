{% extends "template.html" %}
{% block conteudo %}
<section class="intro">
  <h1>Editar {{ animal.nome }}</h1>
  <p>Altere os dados. Envie uma nova foto só se quiser trocar a atual.</p>
</section>

<form class="formulario" action="{{ url_for('atualizar') }}" method="post" enctype="multipart/form-data">
  <input type="hidden" name="id" value="{{ animal.id }}">

  <div class="campo">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" value="{{ animal.nome }}" required>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="especie">Espécie</label>
      <input type="text" id="especie" name="especie" value="{{ animal.especie }}" required>
    </div>
    <div class="campo">
      <label for="raca">Raça</label>
      <input type="text" id="raca" name="raca" value="{{ animal.raca }}" required>
    </div>
  </div>

  <div class="linha">
    <div class="campo">
      <label for="idade">Idade</label>
      <input type="text" id="idade" name="idade" value="{{ animal.idade }}" required>
    </div>
    <div class="campo">
      <label for="porte">Porte</label>
      <select id="porte" name="porte" required>
        {% for p in ['Pequeno', 'Médio', 'Grande'] %}
          <option value="{{ p }}" {% if animal.porte == p %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label for="status">Status</label>
      <select id="status" name="status" required>
        {% for s in ['Disponível', 'Adotado'] %}
          <option value="{{ s }}" {% if animal.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="campo">
    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" rows="5" required>{{ animal.descricao }}</textarea>
  </div>

  <div class="campo">
    <label for="foto">Foto</label>
    <div class="foto-atual">
      <img src="{{ url_for('static', filename='uploads/' ~ animal.foto) }}" alt="Foto atual de {{ animal.nome }}">
      <input type="file" id="foto" name="foto" accept="image/jpeg,image/png">
    </div>
  </div>

  <div class="formulario-acoes">
    <button type="submit" class="btn btn-primario">Salvar alterações</button>
    <a class="btn btn-contorno" href="{{ url_for('inicio') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
